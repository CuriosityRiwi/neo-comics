<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="css/login.css">
  <title>login</title>
</head>

<body>

  <div class="container-form container">

    <div class="carrusel">
      <div id="carouselExample" class="carousel slide">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="img/gallery/cosplay-3876909_1280.jpg" class="d-block w-100" alt="cosplayer">
          </div>
          <div class="carousel-item">
            <img src="img/gallery/cosplay-4553588_640.jpg" class="d-block w-100" alt="cosplayer">
          </div>
          <div class="carousel-item">
            <img src="img/gallery/manga123.jpg" class="d-block w-100" alt="manga">
          </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </div>

    <form class="form">
      <div class="text-form">
        <h1>Bienvenido</h1>
        <p>Inicie sesion con tu cuenta</p>
      </div>
      <div class="input ">
        <label class="text-form" for="user">Usuario</label>
        <input type="text" id="Usuario" placeholder="Usuario">
      </div>
      <div class="input ">
        <label class="text-form" for="Password">Contraseña</label>
        <input type="password" id="Password" placeholder="Contraseña">
      </div>
      <div class="forgotten-password text-form">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
      <div class="input">
        <a href="dashboard.html" class="btn-login">Login</a>
      </div>


    </form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"></script>
</body>

</html>
